version: '3.9'

services:
  # ========================
  # PostgreSQL Database
  # ========================
  postgres:
    image: postgres:16-alpine
    container_name: trialroom-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-trialroom_db}
      POSTGRES_USER: ${POSTGRES_USER:-trialroom}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trialroom_secure_pass_2024}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-trialroom} -d ${POSTGRES_DB:-trialroom_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - trialroom-network

  # ========================
  # Spring Boot Backend
  # ========================
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: trialroom-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-trialroom_db}
      DB_USERNAME: ${POSTGRES_USER:-trialroom}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-trialroom_secure_pass_2024}
      JWT_SECRET: ${JWT_SECRET:-VGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBKV1QgdGhhdCBpcyBhdCBsZWFzdCAyNTYgYml0cyBsb25n}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-86400000}
      AI_API_KEY: ${AI_API_KEY:-sk-placeholder}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:80,http://localhost:4200}
      NOTIFICATION_PROVIDER: ${NOTIFICATION_PROVIDER:-mock}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost:80}
      SPRING_PROFILES_ACTIVE: docker
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/actuator/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s
    networks:
      - trialroom-network

  # ========================
  # Angular Frontend
  # ========================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: trialroom-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "80:80"
    networks:
      - trialroom-network

# ========================
# Volumes
# ========================
volumes:
  postgres_data:
    driver: local

# ========================
# Networks
# ========================
networks:
  trialroom-network:
    driver: bridge
