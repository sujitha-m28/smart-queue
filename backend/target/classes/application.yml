server:
  port: 8080

spring:
  application:
    name: smart-trial-room
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/trialroom_db}
    username: ${DB_USERNAME:trialroom}
    password: ${DB_PASSWORD:trialroom_secure_pass_2024}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      connection-timeout: 30000
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        format_sql: true
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

ai:
  openai:
    api-key: ${AI_API_KEY:sk-placeholder}
    model: ${AI_MODEL:gpt-4o-mini}

app:
  jwt:
    secret: ${JWT_SECRET:VGhpcyBpcyBhIHZlcnkgbG9uZyBzZWNyZXQga2V5IGZvciBKV1QgdGhhdCBpcyBhdCBsZWFzdCAyNTYgYml0cyBsb25n}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://localhost:80}
  notification:
    provider: ${NOTIFICATION_PROVIDER:mock}
  frontend:
    base-url: ${FRONTEND_BASE_URL:http://localhost:4200}
  prediction:
    avg-service-time-minutes: 8
    peak-multiplier: 1.4

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized

logging:
  level:
    com.trialroom: INFO
    org.springframework.security: WARN
